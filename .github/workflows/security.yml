name: 🔒 Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security analysis every Sunday at 4 AM UTC
    - cron: "0 4 * * 0"

jobs:
  # Job 1: CodeQL Analysis
  codeql:
    name: 🔍 CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # Job 2: Dependency Check
  dependency-check:
    name: 🔐 Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 📦 Install Dependencies
        run: poetry install --no-interaction --with=dev

      - name: 🔍 Check for Known Vulnerabilities
        run: |
          poetry run pip install safety
          poetry run safety check --json --output safety-report.json || true

      - name: 📊 Upload Safety Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safety-report
          path: safety-report.json

  # Job 3: Secret Scanning
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for better secret detection

      - name: 🔍 Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # Job 4: Container Security
  container-security:
    name: 🐳 Container Security
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # Skip on scheduled runs

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Build Docker Image
        run: docker build -t workmate-security-scan:latest .

      - name: 🔍 Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "workmate-security-scan:latest"
          format: "sarif"
          output: "trivy-container-results.sarif"

      - name: 📊 Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-container-results.sarif"
          category: "container"

      - name: 🔍 Run Grype Container Scan
        uses: anchore/scan-action@v7
        with:
          image: "workmate-security-scan:latest"
          fail-build: false
          severity-cutoff: high

  # Job 5: Infrastructure Security
  infrastructure-security:
    name: 🏗️ Infrastructure Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🔍 Scan Docker Compose
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./docker-compose.yml"
          format: "sarif"
          output: "trivy-config-results.sarif"

      - name: 📊 Upload Config Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-config-results.sarif"
          category: "config"

      - name: 🔍 Dockerfile Security Check
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif

      - name: 📊 Upload Hadolint Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: "dockerfile"

  # Job 6: Security Report
  security-report:
    name: 📋 Security Report
    runs-on: ubuntu-latest
    needs:
      [
        codeql,
        dependency-check,
        secret-scan,
        container-security,
        infrastructure-security,
      ]
    if: always()

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📊 Generate Security Summary
        run: |
          echo "# 🔒 Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security | ${{ needs.container-security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure Security | ${{ needs.infrastructure-security.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 Security Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Code Analysis** (CodeQL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Vulnerability Scanning** (Safety)" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Detection** (TruffleHog)" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Image Scanning** (Trivy, Grype)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile Security** (Hadolint)" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration Security** (Trivy Config)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review any security findings in the **Security** tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Address critical and high severity issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "4. Fix any configuration security issues" >> $GITHUB_STEP_SUMMARY
