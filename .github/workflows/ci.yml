name: 🚀 Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.3"

jobs:
  # Job 1: Code Quality Checks
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 🔄 Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: 📦 Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with=dev

      - name: 📦 Install project
        run: poetry install --no-interaction

      - name: 🎨 Format Check (Black)
        run: poetry run black --check .

      - name: 🔍 Lint (Ruff)
        run: poetry run ruff check .

      - name: 📝 Type Check (MyPy)
        run: poetry run mypy src/

      - name: 🔒 Security Check (Bandit)
        run: poetry run bandit -r src/

  # Job 2: Testing
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: workmate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Test database configuration
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: workmate_test
      DB_USER: postgres
      DB_PASSWORD: postgres # pragma: allowlist secret

      # Test Redis configuration
      REDIS_HOST: localhost
      REDIS_PORT: 6379

      # Test environment
      ENVIRONMENT: test
      DEBUG: false
      LOG_LEVEL: WARNING

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: 🔄 Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: 📦 Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with=dev

      - name: 📦 Install project
        run: poetry install --no-interaction

      - name: 🗄️ Run Database Migrations
        run: poetry run alembic upgrade head

      - name: 🧪 Run Unit Tests
        run: poetry run pytest tests/unit/ -v

      - name: 🔗 Run Integration Tests
        run: poetry run pytest tests/integration/ -v

      - name: 📊 Run Tests with Coverage
        run: poetry run pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term

      - name: 📈 Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Build & Security Scan
  build:
    name: 🐳 Build & Security
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: workmate:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: workmate:ci-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Job 4: Integration Health Check
  integration-health:
    name: 🏥 Integration Health Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🐳 Build and Start Services
        run: |
          docker-compose -f docker-compose.yml up -d --build
          sleep 30  # Wait for services to be ready

      - name: 🏥 Health Check
        run: |
          # Wait for API to be healthy
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'

          # Test basic API endpoints
          curl -f http://localhost:8000/docs
          curl -f http://localhost:8000/redoc

      - name: 🧹 Cleanup
        if: always()
        run: docker-compose -f docker-compose.yml down -v

  # Job 5: Deployment Preview (Future)
  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: [quality, test, build, integration-health]
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🚀 Deploy Preview Comment
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **CI/CD Pipeline Passed!** ✅\n\n' +
                    '**Quality Checks:** ✅ Passed\n' +
                    '**Tests:** ✅ Passed  \n' +
                    '**Security Scan:** ✅ Passed\n' +
                    '**Integration Health:** ✅ Passed\n\n' +
                    '📦 **Build SHA:** `' + context.sha + '`\n' +
                    '🔗 **Preview Deployment:** _Coming soon..._\n\n' +
                    '---\n' +
                    '*This is an automated message from the CI/CD pipeline*'
            })
